services:
  sync-server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: obsidian-sync-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VAULT_STORAGE_PATH=/app/data/vault
      - GIT_USER_NAME=Obsidian Sync Engine
      - GIT_USER_EMAIL=sync@obsidian.local
    volumes:
      - sync_data:/app/data

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    container_name: obsidian-web-app
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - sync-server

volumes:
  sync_data:
    driver: local
